defaults:
  - _self_

num_envs: 1
freq: 50 # can only be divisible by 200
camera_follow: False
env_name: interiorgs
# Empty means: derive a deterministic, occupancy-safe simulator route from
# data/occupancy.png and data/occupancy .json at startup.
path_file: null
path_loop: False
# Other environments remain available explicitly, for example:
# env_name: obstacle-sparse
# env_name: warehouse

sensor:
  enable_lidar: True
  enable_camera: True
  enable_imu: True
  profile: our-go2-d435-mid360
  color_image: True
  depth_image: True
  semantic_segmentation: True

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: False
